<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ترافل جيت | جودة المحادثات</title><link rel="stylesheet" href="/dashboard/assets/design.css"><link rel="stylesheet" href="/portal/assets/portal.css">
<script src="/portal/assets/portal.js" defer></script></head>
<body><header><a class="brand" href="/portal">TRAVEL GATE <span>جودة المحادثات</span></a><div class="tools"><button id="theme" aria-label="تغيير المظهر">◐</button><span id="identity"></span><button id="logout" hidden>خروج</button></div></header>
<main><div id="notice" role="status" aria-live="polite"></div>
<section id="login" class="card login"><p class="eyebrow">بوابة فريق ترافل جيت</p><h1>أهلًا بيك</h1><p>تابع محادثاتك، وافهم نقاط قوتك وفرص التحسين.</p>
<form id="login-form"><label>اسم المستخدم<input name="username" autocomplete="username" required maxlength="100" dir="ltr"></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary">دخول</button></form></section>
<section id="password" class="card login" hidden><h1>غيّر كلمة المرور المؤقتة</h1><p>اختار كلمة مرور من 12 حرف على الأقل.</p><form id="password-form"><label>كلمة المرور الحالية<input name="current_password" type="password" autocomplete="current-password" required></label><label>كلمة المرور الجديدة<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button class="primary">حفظ وتسجيل الدخول من جديد</button></form></section>
<section id="workspace" hidden><div class="heading"><div><p class="eyebrow">كل محادثة فرصة للتحسين</p><h1 id="page-title">تحليل الموظف</h1><p id="subtitle">درجات الشات من تقييم v6 المعتمد</p></div><div class="filters"><label>من<input id="start" type="date"></label><label>إلى<input id="end" type="date"></label><label id="employee-label" hidden>الموظف<select id="employee"><option value="">كل الفريق</option></select></label><button id="refresh" class="primary">عرض</button></div></div>
<nav aria-label="أقسام البوابة"><button data-tab="chats" class="active">الشات</button><button data-tab="calls">المكالمات</button><button data-tab="team" data-team hidden>أداء الفريق</button><button data-tab="unattributed" data-team hidden>مكالمات بدون موظف</button><button data-tab="health" data-team hidden>حالة المعالجة</button><button data-tab="users" id="users-tab" hidden>الحسابات</button></nav>
<div id="metrics" class="metrics"></div><section id="weekly" class="card"></section><section id="content" class="card" aria-live="polite"></section><div class="pagination"><button id="previous">السابق</button><span id="page-number"></span><button id="next">التالي</button></div></section>
</main><dialog id="detail"><div class="dialog-top"><h2 id="detail-title">تفاصيل المحادثة</h2><button id="close-detail" aria-label="إغلاق">✕</button></div><div id="detail-content"></div></dialog><footer>ترافل جيت · مساحة خاصة بفريق العمل</footer></body></html>
